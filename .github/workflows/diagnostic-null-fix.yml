name: Diagnostic Feedback Null Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnostic-null-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply null normalization fix
        run: python scripts/fix-diagnostic-null-values.py

      - name: Run Node regression suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            node "$test_file"
          done

      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0

      - name: Run all Chrome gates
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
          BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          node tests/exercise-routing.browser.cjs
          node tests/student-dashboard-v2.browser.cjs
          node tests/diagnostic-feedback.browser.cjs
          node tests/editor-progress-note-value.browser.cjs
          node tests/feedback-notation-errors.browser.cjs
          node tests/mobile-safari.browser.cjs

      - name: Commit verified fix and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnostic-null-fix.yml scripts/fix-diagnostic-null-values.py
          git add src/diagnostic-feedback.js tests/diagnostic-feedback.test.js
          git commit -m "Fix missing diagnostic score normalization"
          git push
