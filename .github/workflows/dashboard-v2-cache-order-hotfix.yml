name: Dashboard V2 loader patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard-v2-cache-order-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified loader-order patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="./src/dashboard/student-dashboard-v2.js?v=20260913-dashboard-v2-fix1" data-student-dashboard-v2="true"></script>\n', '')
          s = s.replace('<script src="./src/dashboard/student-dashboard-v2-compat.js?v=20260913-dashboard-v2-fix1" data-student-dashboard-v2-compat="true"></script>\n', '')
          p.write_text(s, encoding='utf-8')

          p = Path('src/data/dashboard.repository.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("./src/dashboard/student-dashboard-v2.js'", "./src/dashboard/student-dashboard-v2.js?v=20260913-dashboard-v2-fix2'")
          s = s.replace("./src/dashboard/student-dashboard-v2-compat.js'", "./src/dashboard/student-dashboard-v2-compat.js?v=20260913-dashboard-v2-fix2'")
          p.write_text(s, encoding='utf-8')

          p = Path('tests/student-dashboard-v2.test.js')
          s = p.read_text(encoding='utf-8')
          old = """assert(indexHtml.includes('src/dashboard/student-dashboard-v2.js?v='), 'Production HTML must load Dashboard V2 JS directly');
assert(indexHtml.includes('src/dashboard/student-dashboard-v2-compat.js?v='), 'Production HTML must load Dashboard V2 compatibility layer directly');
assert.strictEqual((indexHtml.match(/src\\/dashboard\\/student-dashboard-v2\\.js\\?v=/g)||[]).length,1,'Production HTML must load Dashboard V2 JS exactly once');"""
          new = """assert(!indexHtml.includes('<script src=\"./src/dashboard/student-dashboard-v2.js'), 'Production HTML must preserve additive V2 load order');
assert(!indexHtml.includes('<script src=\"./src/dashboard/student-dashboard-v2-compat.js'), 'Production HTML must preserve compatibility load order');
assert(repository.includes('student-dashboard-v2.js?v='), 'Deferred V2 script must be cache-busted');
assert(repository.includes('student-dashboard-v2-compat.js?v='), 'Deferred V2 compatibility script must be cache-busted');"""
          if old not in s:
              raise SystemExit('Dashboard V2 test wiring block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/fixtures/v091-path-stage-boundary.json')
          fixture = json.loads(p.read_text(encoding='utf-8'))
          fixture['files']['index.html']['afterSha256'] = hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          p.write_text(json.dumps(fixture, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          set -e
          for f in tests/*.test.js; do node "$f" >/dev/null; done

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-v2-cache-order-hotfix.yml
          git add index.html src/data/dashboard.repository.js tests/student-dashboard-v2.test.js tests/fixtures/v091-path-stage-boundary.json
          git commit -m "Preserve Dashboard V2 load order with cache-safe assets"
          git push
