name: One-off QA diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-debug-once.yml'

permissions:
  contents: write

jobs:
  diagnose-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Capture real Chrome E2E output
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
          BROWSER_CHANNEL: chrome
        run: |
          : > QA-BROWSER-DEBUG.txt
          if node tests/exercise-routing.browser.cjs >> QA-BROWSER-DEBUG.txt 2>&1; then
            echo "RESULT: PASS" >> QA-BROWSER-DEBUG.txt
          else
            echo "RESULT: FAIL" >> QA-BROWSER-DEBUG.txt
          fi
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QA-BROWSER-DEBUG.txt
          git commit -m "Capture Chrome E2E diagnostics"
          git push origin HEAD:main
