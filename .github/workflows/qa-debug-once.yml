name: One-off QA diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-debug-once.yml'

permissions:
  contents: write

jobs:
  diagnose-node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every Node test and capture failures
        shell: bash
        run: |
          : > QA-DEBUG.txt
          failed=0
          for test_file in tests/*.test.js; do
            echo "===== $test_file =====" >> QA-DEBUG.txt
            if node "$test_file" >> QA-DEBUG.txt 2>&1; then
              echo "RESULT: PASS" >> QA-DEBUG.txt
            else
              echo "RESULT: FAIL" >> QA-DEBUG.txt
              failed=1
            fi
            echo >> QA-DEBUG.txt
          done
          echo "ANY_FAILURE=$failed" >> QA-DEBUG.txt
      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QA-DEBUG.txt
          git commit -m "Capture QA node test diagnostics"
          git push origin HEAD:main
