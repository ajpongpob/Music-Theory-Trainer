name: Apply register yellow-gray theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-theme-once.yml'

permissions:
  contents: write

jobs:
  patch-register-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Append register-only visual overrides
        shell: bash
        env:
          REGISTER_THEME_CSS_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          path = Path('styles/app.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== Register visual differentiation: yellow-gray accent ===== */'
          if marker in text:
              print('Register theme override already present; nothing to append.')
              raise SystemExit(0)

          block = base64.b64decode(os.environ['REGISTER_THEME_CSS_B64']).decode('utf-8')
          path.write_text(text.rstrip() + '\n\n' + block, encoding='utf-8')
          PY

      - name: Commit theme update
        shell: bash
        run: |
          if git diff --quiet -- styles/app.css; then
            echo "No CSS change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/app.css
          git commit -m "Style register screen with yellow-gray accents"
          git push origin HEAD:main
