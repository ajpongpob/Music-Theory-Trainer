name: v081b1-final-qa

on:
  push:
    branches:
      - dev/v0.8.1-b1-renderer-foundation

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Node regression suite
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Install Playwright for browser QA
        run: npm install --no-save playwright
      - name: Run real-browser routing and interaction QA
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/exercise-routing.browser.cjs
