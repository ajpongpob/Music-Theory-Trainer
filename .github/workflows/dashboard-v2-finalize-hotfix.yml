name: Dashboard V2 finalize hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard-v2-finalize-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize cache-busting test compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          smoke = Path('tests/dashboard-runtime-smoke.test.js')
          lines = smoke.read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(lines) if 'const scripts=[...html.matchAll' in line]
          if len(hits) != 1:
              raise SystemExit(f'Expected exactly one script extraction line, found {len(hits)}')
          lines[hits[0]] = "  const scripts=[...html.matchAll(/<script\\s+src=\"\\.\\/(src\\/[^\"?#]+\\.js)(?:[?#][^\"]*)?\"/g)].map(m=>m[1]).filter(f=>!['src/trainer.js','src/keyboard.js','src/dashboard/student-dashboard-v2.js','src/dashboard/student-dashboard-v2-compat.js'].includes(f));"
          smoke.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          fixture_path = Path('tests/fixtures/v091-path-stage-boundary.json')
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          index_bytes = Path('index.html').read_bytes()
          fixture['files']['index.html']['afterSha256'] = hashlib.sha256(index_bytes).hexdigest()
          fixture_path.write_text(json.dumps(fixture, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done

      - name: Commit verified compatibility fixes and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/dashboard-v2-smoke-hotfix.yml \
            .github/workflows/dashboard-v2-smoke-hotfix-v2.yml \
            .github/workflows/dashboard-v2-finalize-hotfix.yml
          git add tests/dashboard-runtime-smoke.test.js tests/fixtures/v091-path-stage-boundary.json
          git commit -m "Finalize Dashboard V2 cache-safe production wiring"
          git push
