name: Dashboard V2 one-shot wiring hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard-v2-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Student Dashboard V2 directly and cache-bust dashboard assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '<link rel="stylesheet" href="./styles/app.css">',
                  '<link rel="stylesheet" href="./styles/app.css?v=20260913-dashboard-v2-fix1">\n'
                  '<link rel="stylesheet" href="./styles/student-dashboard-v2.css?v=20260913-dashboard-v2-fix1" data-student-dashboard-v2-style="true">'
              ),
              (
                  '<script src="./src/data/dashboard.repository.js"></script>',
                  '<script src="./src/data/dashboard.repository.js?v=20260913-dashboard-v2-fix1"></script>'
              ),
              (
                  '<script src="./src/auth-dashboard.js"></script>',
                  '<script src="./src/auth-dashboard.js"></script>\n'
                  '<script src="./src/dashboard/student-dashboard-v2.js?v=20260913-dashboard-v2-fix1" data-student-dashboard-v2="true"></script>\n'
                  '<script src="./src/dashboard/student-dashboard-v2-compat.js?v=20260913-dashboard-v2-fix1" data-student-dashboard-v2-compat="true"></script>'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node tests/package-static-integrity.test.js
          node tests/student-dashboard-v2.test.js

      - name: Commit verified hotfix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-v2-hotfix.yml
          git add index.html
          git commit -m "Fix Student Dashboard V2 production wiring and cache"
          git push
