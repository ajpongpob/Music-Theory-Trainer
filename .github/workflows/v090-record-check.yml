name: v090-record-check
on:
  push:
    branches: [dev/v0.9.0-mastery-learning-core]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.9.0-mastery-learning-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generic progression migration and full Node suite
        run: |
          node tests/mastery-learning-advance-sql.test.js
          for f in tests/*.test.js; do node "$f"; done
      - name: Verify final delta
        run: |
          test -f supabase/migrations/20260912_v090_generic_stage_advancement.sql
          test -f tests/mastery-learning-advance-sql.test.js
      - name: Remove temporary workflow and commit verified record
        run: |
          rm -f .github/workflows/v090-record-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify v0.9.0 generic stage progression record"
          git push origin HEAD:dev/v0.9.0-mastery-learning-core
