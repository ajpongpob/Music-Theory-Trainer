name: v081b1-renderer-foundation

on:
  push:
    branches:
      - dev/v0.8.1-b1-renderer-foundation

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply renderer foundation patch
        run: |
          node tools/apply-v081b1-renderer.cjs
          node tools/fix-v081b1-tests.cjs
      - name: JavaScript syntax checks
        run: |
          find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run automated regression suite
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Verify scope diff
        run: |
          git diff --name-only
          git diff -- src/trainer.js src/domain/notation/notation-renderer.js index.html tests/notation-boundary.test.js tests/notation-renderer-foundation.test.js tests/major-scale-domain.test.js tests/helpers/restore-renderer-foundation.cjs
      - name: Remove temporary patch machinery
        run: |
          rm -f tools/apply-v081b1-renderer.cjs tools/fix-v081b1-tests.cjs .github/workflows/v081b1-renderer.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit tested checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract notation renderer foundation"
          git push origin HEAD:dev/v0.8.1-b1-renderer-foundation
