name: Apply landscape score fix

on:
  push:
    branches:
      - m1-pilot-closeout

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch landscape notation policy and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          trainer_path=Path('src/trainer.js')
          trainer=trainer_path.read_text()
          old='''function arrangeCompactScore(){\n compactScore=scoreSvg.parentElement.clientWidth<800;\n scoreSvg.setAttribute("viewBox",compactScore?"0 0 700 660":"0 0 1400 350");'''
          new='''function arrangeCompactScore(){\n const stageWidth=scoreSvg.parentElement.clientWidth;\n const viewportWidth=window.visualViewport?.width || window.innerWidth || stageWidth;\n const viewportHeight=window.visualViewport?.height || window.innerHeight || Number.POSITIVE_INFINITY;\n const landscape=viewportWidth>viewportHeight;\n compactScore=stageWidth<800 && !landscape;\n scoreSvg.setAttribute("viewBox",compactScore?"0 0 700 660":"0 0 1400 350");'''
          if old not in trainer:
              raise SystemExit('arrangeCompactScore target not found')
          trainer_path.write_text(trainer.replace(old,new,1))

          css_path=Path('styles/mobile-safari-fix.css')
          css=css_path.read_text()
          old_media='@media (max-width:815px){'
          if old_media not in css:
              raise SystemExit('portrait Safari media target not found')
          css=css.replace(old_media,'@media (max-width:815px) and (orientation:portrait){',1)
          landscape_block='''\n\n/* Landscape uses the full three-measure overview on one system.\n   Keep the SVG at its native 4:1 score aspect instead of the portrait\n   three-system height. */\n@media (orientation:landscape) and (max-height:540px){\n  html,\n  body{\n    overflow-x:hidden !important;\n    overflow-y:auto !important;\n  }\n\n  .session-app{\n    width:100% !important;\n    max-width:none !important;\n  }\n\n  .workspace-card .score-stage{\n    width:100% !important;\n    height:auto !important;\n    min-height:0 !important;\n    overflow:hidden !important;\n    align-items:center !important;\n  }\n\n  .workspace-card #scoreSvg{\n    width:100% !important;\n    height:auto !important;\n    min-height:0 !important;\n    max-height:none !important;\n    aspect-ratio:4 / 1 !important;\n    overflow:visible !important;\n    flex-shrink:0;\n  }\n}\n'''
          if '@media (orientation:landscape) and (max-height:540px)' not in css:
              css += landscape_block
          css_path.write_text(css)

          layout_test_path=Path('tests/mobile-safari-layout.test.js')
          layout_test_path.write_text(r'''\'use strict\';
          const fs=require('fs'),path=require('path'),assert=require('assert');
          const root=path.resolve(__dirname,'..');
          const css=fs.readFileSync(path.join(root,'styles/mobile-safari-fix.css'),'utf8');
          const shell=fs.readFileSync(path.join(root,'src/auth-dashboard.js'),'utf8');
          const trainer=fs.readFileSync(path.join(root,'src/trainer.js'),'utf8');

          assert(shell.includes("./styles/mobile-safari-fix.css"),'UI shell must load the narrow-screen Safari fix stylesheet');
          assert(css.includes('@media (max-width:815px) and (orientation:portrait)'),'three-system Safari score growth must be portrait-only');
          assert(css.includes('@media (orientation:landscape) and (max-height:540px)'),'landscape must have an explicit single-row score layout');
          assert(css.includes('aspect-ratio:4 / 1 !important'),'landscape score must preserve the native three-measure 4:1 aspect');
          assert(css.includes('overflow-y:auto !important'),'narrow Trainer must allow vertical page scrolling');
          assert(css.includes('.workspace-card')&&css.includes('overflow:visible !important'),'portrait workspace must not clip compact systems 2-3');
          assert(css.includes('grid-template-rows:auto auto auto !important'),'portrait session grid must allow the workspace to grow');
          assert(css.includes('.workspace-card .notation-palette')&&css.includes('position:static !important'),'mobile palette must not remain sticky over the navigation row');
          assert(css.includes('min-height:44px !important'),'mobile navigation controls must preserve touch-sized hit targets');
          assert(css.includes('pointer-events:none !important'),'shortcut labels must never intercept touch events');
          assert(trainer.includes('const landscape=viewportWidth>viewportHeight;'),'score renderer must detect landscape orientation');
          assert(trainer.includes('compactScore=stageWidth<800 && !landscape;'),'landscape must bypass the portrait three-system compact renderer');
          console.log('PASS mobile Safari layout contract: portrait keeps reachable 3-system score; landscape uses one 4:1 overview system; touch fixes remain intact');
          ''')

          browser_path=Path('tests/mobile-safari.browser.cjs')
          browser=browser_path.read_text()
          marker="""    assert.equal(await page.evaluate(()=>__qa.state.cursorStaffStep),beforePitch+1,'touching up arrow must execute pitchUp');\n\n    assert.deepEqual(errors,[],'mobile Safari regression fixture must not raise page errors');"""
          insert="""    assert.equal(await page.evaluate(()=>__qa.state.cursorStaffStep),beforePitch+1,'touching up arrow must execute pitchUp');\n\n    // Rotate to iPhone landscape. The same three measures should now render\n    // as one continuous system instead of the portrait three-system stack.\n    await page.setViewportSize({width:844,height:390});\n    await page.evaluate(()=>window.__qa.render());\n    await page.waitForTimeout(100);\n    const landscape=await page.evaluate(()=>{\n      const svg=document.getElementById('scoreSvg');\n      const rect=svg.getBoundingClientRect();\n      return {\n        systemCount:svg.querySelectorAll('g[data-system]').length,\n        viewBox:svg.getAttribute('viewBox'),\n        width:rect.width,\n        height:rect.height,\n        innerWidth:window.innerWidth,\n        innerHeight:window.innerHeight\n      };\n    });\n    assert.equal(landscape.systemCount,0,'iPhone landscape must not use the portrait three-system compact score');\n    assert.equal(landscape.viewBox,'0 0 1400 350','iPhone landscape must render the full three-measure one-system viewBox');\n    assert(landscape.width<=landscape.innerWidth+2,'iPhone landscape score must fit the viewport width');\n    assert(landscape.width>landscape.height*3.5,'iPhone landscape score must retain a wide single-row overview');\n\n    assert.deepEqual(errors,[],'mobile Safari regression fixture must not raise page errors');"""
          if marker not in browser:
              raise SystemExit('mobile Safari browser insertion point not found')
          browser_path.write_text(browser.replace(marker,insert,1))

          live_path=Path('tests/live-pilot-viewports.browser.cjs')
          live=live_path.read_text()
          viewport_marker="""  {name:'tablet-landscape',width:1024,height:768},\n  {name:'tablet-portrait',width:768,height:1024},\n  {name:'mobile-390',width:390,height:844},"""
          viewport_insert="""  {name:'tablet-landscape',width:1024,height:768},\n  {name:'tablet-portrait',width:768,height:1024},\n  {name:'mobile-landscape',width:844,height:390},\n  {name:'mobile-390',width:390,height:844},"""
          if viewport_marker not in live:
              raise SystemExit('live viewport list insertion point not found')
          live=live.replace(viewport_marker,viewport_insert,1)

          compact_marker="""  if(viewport.width<=815){\n    await page.waitForFunction(()=>Array.from(document.styleSheets).some(sheet=>String(sheet.href||'').includes('mobile-safari-fix.css')),{timeout:30000});"""
          compact_insert="""  const isLandscape=viewport.width>viewport.height;\n  if(isLandscape){\n    const landscapeScore=await compactScoreMetrics(page);\n    assert.equal(landscapeScore.systemCount,0,`${viewport.name}: landscape score must use one continuous system`);\n    assert.equal(landscapeScore.viewBox,'0 0 1400 350',`${viewport.name}: landscape score must use the full three-measure viewBox`);\n  }\n\n  if(viewport.width<=815 && !isLandscape){\n    await page.waitForFunction(()=>Array.from(document.styleSheets).some(sheet=>String(sheet.href||'').includes('mobile-safari-fix.css')),{timeout:30000});"""
          if compact_marker not in live:
              raise SystemExit('live compact condition insertion point not found')
          live=live.replace(compact_marker,compact_insert,1)

          return_marker="""    compactSystems:viewport.width<=815 ? 3 : null,\n    thirdSystemReachable:viewport.width<=815 ? true : null,\n    touchTargets:viewport.width<=699 ? true : null,"""
          return_insert="""    compactSystems:isLandscape ? 0 : (viewport.width<=815 ? 3 : null),\n    thirdSystemReachable:!isLandscape && viewport.width<=815 ? true : null,\n    touchTargets:!isLandscape && viewport.width<=699 ? true : null,"""
          if return_marker not in live:
              raise SystemExit('live result metadata insertion point not found')
          live_path.write_text(live.replace(return_marker,return_insert,1))
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-landscape-score-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trainer.js styles/mobile-safari-fix.css tests/mobile-safari-layout.test.js tests/mobile-safari.browser.cjs tests/live-pilot-viewports.browser.cjs .github/workflows/apply-landscape-score-fix.yml
          git commit -m "Fix landscape notation to single-row overview"
          git push origin HEAD:m1-pilot-closeout
