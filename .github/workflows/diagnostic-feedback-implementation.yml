name: Diagnostic Feedback Implementation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnostic-feedback-implementation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply diagnostic feedback patch
        run: |
          python scripts/apply-diagnostic-feedback.py
          python scripts/fix-diagnostic-labels.py
          python scripts/update-diagnostic-contracts.py

      - name: Run Node regression suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            echo "==> $test_file"
            node "$test_file"
          done

      - name: Install pinned Playwright library
        run: npm install --no-save --ignore-scripts playwright@1.63.0

      - name: Run existing Chrome regression gates
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" BROWSER_CHANNEL=chrome node tests/exercise-routing.browser.cjs
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" BROWSER_CHANNEL=chrome node tests/editor-progress-note-value.browser.cjs
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" BROWSER_CHANNEL=chrome node tests/feedback-notation-errors.browser.cjs
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" BROWSER_CHANNEL=chrome node tests/mobile-safari.browser.cjs

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnostic-feedback-implementation.yml scripts/apply-diagnostic-feedback.py scripts/fix-diagnostic-labels.py scripts/update-diagnostic-contracts.py
          git add src/trainer.js src/m15-learning-feedback.js src/diagnostic-feedback.js tests/diagnostic-feedback.test.js tests/answer-feedback-transition.test.js
          git commit -m "Add mastery-first diagnostic feedback and session results"
          git push
