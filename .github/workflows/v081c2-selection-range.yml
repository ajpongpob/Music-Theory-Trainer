name: v081c2-selection-range
on:
  push:
    branches: [dev/v0.8.1-c1-interaction-foundation]
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.8.1-c1-interaction-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply selection-range extraction
        run: node tools/apply-v081c2-selection-range.cjs
      - name: JavaScript syntax checks
        run: |
          node --check src/domain/notation/notation-interaction.js
          node --check src/trainer.js
          node --check tests/notation-interaction.test.js
          node --check tests/helpers/restore-notation-interaction.cjs
      - name: Automated regression suite
        run: |
          for f in tests/*.test.js; do node "$f"; done
      - name: Install Playwright for browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
      - name: Real-browser routing and interaction QA
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/exercise-routing.browser.cjs
      - name: Remove browser QA dependencies
        run: rm -rf node_modules package-lock.json package.json
      - name: Remove temporary QA machinery
        run: rm -f tools/apply-v081c2-selection-range.cjs .github/workflows/v081c2-selection-range.yml
      - name: Verify approved scope
        run: |
          allowed='^(src/domain/notation/notation-interaction\.js|src/trainer\.js|tests/helpers/restore-notation-interaction\.cjs|tests/notation-interaction\.test\.js)$'
          bad=$(git diff --name-only HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Unexpected scope:"; echo "$bad"; exit 1; fi
      - name: Commit tested checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.8.1-c2 — Selection Range Helpers"
          git push origin HEAD:dev/v0.8.1-c1-interaction-foundation
