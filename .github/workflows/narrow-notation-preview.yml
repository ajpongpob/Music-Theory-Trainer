name: narrow-notation-preview

on:
  push:
    branches:
      - dev/v0.8.1-feedback-answer-snapshot

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow-screen notation patch
        run: node tools/apply-narrow-notation-layout.cjs
      - name: Syntax checks
        run: |
          find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Node regression suite
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Install Playwright for browser QA
        run: npm install --no-save playwright
      - name: Real-browser desktop and narrow-screen QA
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/exercise-routing.browser.cjs
      - name: Remove browser QA dependencies
        run: rm -rf node_modules package-lock.json
      - name: Verify approved scope
        run: |
          allowed='index.html
          src/trainer.js
          styles/app.css
          tests/answer-feedback-transition.test.js
          tests/exercise-routing.browser.cjs
          tests/helpers/restore-feedback-answer-snapshot.cjs
          tests/helpers/restore-narrow-notation-layout.cjs
          tests/major-scale-domain.test.js
          tests/notation-boundary.test.js'
          actual=$({ git diff --name-only origin/main...HEAD; git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^tools/' | grep -v '^\.github/' | sort -u)
          expected=$(printf '%s\n' "$allowed" | sed 's/^ *//' | sed '/^$/d' | sort)
          printf 'Actual scope:\n%s\n' "$actual"
          printf 'Expected scope:\n%s\n' "$expected"
          test "$actual" = "$expected"
      - name: Remove temporary QA machinery
        run: |
          rm -f tools/apply-narrow-notation-layout.cjs .github/workflows/narrow-notation-preview.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit tested preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: enlarge narrow-screen notation and compact review"
          git push origin HEAD:dev/v0.8.1-feedback-answer-snapshot
