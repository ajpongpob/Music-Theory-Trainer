name: v081b4-score-layout
on:
  push:
    branches:
      - dev/v0.8.1-b4-score-layout
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply score layout extraction
        run: node tools/apply-v081b4-score-layout.cjs
      - name: JavaScript syntax checks
        run: find src tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Automated regression suite
        run: |
          set -e
          for f in tests/*.test.js; do
            echo "==> $f"
            node "$f"
          done
      - name: Install Playwright for browser QA
        run: npm install --no-save playwright
      - name: Real-browser routing and interaction QA
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/exercise-routing.browser.cjs
      - name: Remove browser QA dependencies
        run: rm -rf node_modules package-lock.json
      - name: Verify approved scope
        run: |
          allowed='src/domain/notation/notation-renderer.js
          src/trainer.js
          tests/helpers/restore-renderer-score-layout.cjs
          tests/major-scale-domain.test.js
          tests/notation-boundary.test.js
          tests/notation-renderer-score-layout.test.js'
          actual=$({ git diff --name-only origin/main...HEAD; git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^tools/' | grep -v '^\.github/' | sort -u)
          expected=$(printf '%s\n' "$allowed" | sed 's/^ *//' | sed '/^$/d' | sort)
          printf 'Actual scope:\n%s\n' "$actual"
          printf 'Expected scope:\n%s\n' "$expected"
          test "$actual" = "$expected"
      - name: Remove temporary QA machinery
        run: |
          rm -f tools/apply-v081b4-score-layout.cjs .github/workflows/v081b4-score-layout.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit tested checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract score layout and staff frame"
          git push origin HEAD:dev/v0.8.1-b4-score-layout
