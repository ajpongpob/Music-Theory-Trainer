name: v081d-architecture-freeze-v2
on:
  push:
    branches: [dev/v0.8.1-d-architecture-freeze]
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.8.1-d-architecture-freeze
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.8.1-d extraction
        run: |
          node tools/capture-v081d-boundary.cjs
          node tools/apply-v081d-lite.cjs
          node tools/patch-v081d-domain-test.cjs
          node tools/finalize-v081d-boundary.cjs
      - name: Syntax checks
        run: |
          node --check src/domain/notation/notation-interaction.js
          node --check src/domain/notation/notation-beaming.js
          node --check src/trainer.js
          node --check tests/notation-interaction.test.js
          node --check tests/notation-beaming.test.js
          node --check tests/notation-architecture-freeze.test.js
          node --check tests/helpers/restore-notation-beaming.cjs
      - name: Full Node regression suite
        run: |
          for f in tests/*.test.js; do node "$f"; done
      - name: Chrome E2E
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          BROWSER_CHANNEL=chrome node tests/exercise-routing.browser.cjs
          rm -rf node_modules package-lock.json package.json
      - name: Remove temporary QA machinery
        run: |
          rm -f tools/apply-v081d-architecture-freeze.cjs tools/fix-v081d-patcher.cjs tools/capture-v081d-boundary.cjs tools/finalize-v081d-boundary.cjs tools/apply-v081d-lite.cjs tools/patch-v081d-domain-test.cjs .github/workflows/v081d-architecture-freeze-v2.yml
      - name: Verify approved scope
        run: |
          allowed='^(index\.html|src/trainer\.js|src/domain/notation/notation-interaction\.js|src/domain/notation/notation-beaming\.js|tests/helpers/restore-notation-beaming\.cjs|tests/fixtures/v081d-pre-extraction\.json|tests/major-scale-domain\.test\.js|tests/notation-boundary\.test\.js|tests/notation-interaction\.test\.js|tests/notation-beaming\.test\.js|tests/notation-architecture-freeze\.test\.js)$'
          bad=$(git diff --name-only origin/main -- . | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Unexpected scope:"; echo "$bad"; exit 1; fi
      - name: Commit tested checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.8.1-d — Interaction + Beaming Architecture Freeze"
          git push origin HEAD:dev/v0.8.1-d-architecture-freeze
